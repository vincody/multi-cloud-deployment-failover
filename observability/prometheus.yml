# TODO: thay `example.com` bằng domain_name thật của bạn (trùng với deploy/terraform/terraform.tfvars)
# ở đúng 5 URL bên dưới: 3 URL /health/live (job blackbox_https) và 2 URL /health/database (job blackbox_writer).
global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: blackbox_https
    metrics_path: /probe
    params:
      module: [https_ready]
    static_configs:
      - targets: ["https://aws.example.com/health/live"]
        labels:
          target_name: aws
      - targets: ["https://azure.example.com/health/live"]
        labels:
          target_name: azure
      - targets: ["https://app.example.com/health/live"]
        labels:
          target_name: shared-domain
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Writer probe: only the current primary answers 200, so this series shows which cloud
  # holds the writer and exactly when it moves during a failover.
  - job_name: blackbox_writer
    metrics_path: /probe
    params:
      module: [https_ready]
    static_configs:
      - targets: ["https://aws.example.com/health/database"]
        labels:
          target_name: aws
      - targets: ["https://azure.example.com/health/database"]
        labels:
          target_name: azure
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
