<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Issues — DCS29</title><link rel="stylesheet" href="/origin.css"><link rel="stylesheet" href="/issues.css"><script src="/issues.js" defer></script></head>
<body>
<header><a class="brand" href="/issues.html"><span class="repo-icon" aria-hidden="true">◉</span> <span>Issues</span></a><div class="origin" id="origin" role="status" aria-live="polite"><span class="origin-dot" aria-hidden="true"></span><span id="origin-label">Đang xác định máy chủ…</span><span id="origin-region"></span></div></header>
<p id="database-mode" class="database-mode" role="status" aria-live="polite">Đang kiểm tra database…</p>
<main>
<div class="page-heading"><h1>Issues <span id="total" class="count">—</span></h1><button id="new" class="primary">＋ Tạo issue</button></div>
<div class="search-bar"><span aria-hidden="true" class="search-icon">⌕</span><input id="search" type="search" placeholder="Tìm kiếm issue theo tiêu đề, mô tả hoặc #số…" aria-label="Tìm issue"><button id="refresh">Làm mới</button></div>
<section class="board" aria-label="Issues"><div class="toolbar"><nav aria-label="Lọc issue"><button class="filter selected" data-filter="all">Tất cả</button><button class="filter" data-filter="open"><span aria-hidden="true">◉</span> Open <span id="open-count" class="count">—</span></button><button class="filter" data-filter="closed"><span aria-hidden="true">✓</span> Closed <span id="closed-count" class="count">—</span></button></nav><div class="list-options"><select id="author-filter" aria-label="Lọc người tạo"><option value="">Author: Tất cả</option></select><select id="sort" aria-label="Sắp xếp issue"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="updated">Recently updated</option></select></div></div><p id="notice" role="status" aria-live="polite"></p><div id="list" aria-label="Danh sách issue"></div></section>
</main>
<dialog id="editor" aria-labelledby="editor-heading"><form id="issue-form"><div class="dialog-heading"><div><div class="eyebrow">ISSUE</div><h2 id="editor-heading">Tạo issue</h2></div><button type="button" id="editor-close" aria-label="Đóng form">✕</button></div><p id="draft-info" class="hint"></p><label for="issue-author">Tên người gửi</label><input id="issue-author" required maxlength="80" autocomplete="name" placeholder="Tên của bạn"><label for="title">Tiêu đề</label><input id="title" required maxlength="160" placeholder="Vấn đề bạn đang gặp là gì?"><label for="description">Mô tả</label><textarea id="description" rows="6" maxlength="10000" placeholder="Các bước tái hiện, kết quả mong đợi…"></textarea><label for="status">Trạng thái</label><select id="status"><option value="open">Open</option><option value="closed">Closed</option></select><p id="form-message" role="status" aria-live="polite"></p><div class="actions"><button type="button" id="reload">Tải bản mới</button><button type="button" id="discard">Bỏ bản nháp</button><button type="submit" id="save" class="primary">Tạo issue</button></div></form></dialog>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-heading"><button id="detail-close" aria-label="Đóng chi tiết">← Danh sách issue</button></div><h2 id="detail-title" tabindex="-1"></h2><div class="detail-status"><span id="detail-state" class="badge"></span><p id="detail-meta" class="hint"></p></div><p id="detail-message" role="status" aria-live="polite"></p><div class="detail-actions"><button id="edit">Chỉnh sửa issue</button><button id="toggle">Đóng issue</button></div><div class="detail-layout"><div class="conversation"><div id="thread"></div><form id="comment-form"><h3>Thêm bình luận</h3><label for="comment-author">Tên người bình luận</label><input id="comment-author" required maxlength="80" autocomplete="name" placeholder="Tên của bạn"><label for="comment-body">Nội dung bình luận</label><textarea id="comment-body" required maxlength="10000" rows="4" placeholder="Thêm thông tin hoặc đề xuất giải pháp…"></textarea><p id="comment-draft-info" class="hint"></p><p id="comment-message" role="status" aria-live="polite"></p><div class="actions"><button type="button" id="comment-discard">Bỏ bản nháp bình luận</button><button type="submit" id="comment-save" class="primary">Gửi bình luận</button></div></form><section class="history"><h3>Lịch sử hoạt động</h3><div id="history"></div></section></div><aside class="issue-sidebar" aria-label="Thông tin issue"><section><h3>Người tạo</h3><div id="sidebar-author"></div></section><section><h3>Trạng thái</h3><p id="sidebar-status"></p></section><section><h3>Bình luận</h3><p id="sidebar-comments"></p></section><section><h3>Ngày tạo</h3><p id="sidebar-created"></p></section><section><h3>Cập nhật gần nhất</h3><p id="sidebar-updated"></p></section><section><h3>Người tham gia</h3><div id="participants"></div></section></aside></div></dialog>
</body></html>
