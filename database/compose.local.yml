name: hetinhtoanphanbo
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - taskflow-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  taskflow-local:
