name: Test and publish container

# Documentation, diagrams and monitoring config do not change the image, so they skip the
# build. Tag pushes ignore path filters and always publish.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "observability/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "observability/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: local-demo-only
          POSTGRES_DB: taskflow
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TASKFLOW_DB_TESTS: "1"
      DATABASE_URL: postgresql://taskflow:local-demo-only@127.0.0.1:55432/taskflow
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run API tests
        run: python -m pytest -q

  container:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p image-identity
          {
            echo "image=${IMAGE_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "digest=${{ steps.build.outputs.digest }}"
            echo "platform=linux/amd64"
          } | tee image-identity/manifest.txt
          {
            echo "### Container image"
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platform: \`linux/amd64\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload image identity manifest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-identity-${{ github.sha }}
          path: image-identity/manifest.txt
          retention-days: 90

  verify-published-image:
    if: github.event_name != 'pull_request'
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable image and verify runtime
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "${image_ref}"
          docker run --detach --name dcs29-ci-verify --publish 18080:8080 --env APP_ENV=ci-clean-pull --env APP_REGION=github-actions "${image_ref}"
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:18080/health/live; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:18080/version
          docker inspect dcs29-ci-verify --format 'image={{.Image}} status={{.State.Status}}'
          docker stop dcs29-ci-verify
